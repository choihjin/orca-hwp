<!doctype html>
<!-- Plugin icon source: a page with a table and a magnifier. No company logo or trademark text.
     Render: assets/src/render.sh images (512×512 PNG → assets/icon.png). -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; background: transparent; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0B1B3F" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- page with a folded corner -->
    <path d="M136 92 H316 L380 156 V420 H136 Z" fill="url(#paper)"/>
    <path d="M316 92 V156 H380 Z" fill="#BAE6FD"/>
    <!-- title line -->
    <rect x="170" y="128" width="112" height="16" rx="8" fill="#4338CA" opacity="0.85"/>
    <!-- table -->
    <g fill="none" stroke="#4338CA" stroke-opacity="0.7" stroke-width="8" stroke-linejoin="round">
      <rect x="170" y="182" width="176" height="164" rx="6"/>
      <line x1="170" y1="236" x2="346" y2="236"/>
      <line x1="170" y1="290" x2="346" y2="290"/>
      <line x1="226" y1="182" x2="226" y2="346"/>
    </g>
    <rect x="174" y="186" width="168" height="46" fill="#4338CA" opacity="0.18"/>
  </g>
  <!-- magnifier -->
  <g filter="url(#shadow)">
    <circle cx="338" cy="352" r="62" fill="#FFFFFF" fill-opacity="0.22" stroke="#FFFFFF" stroke-width="18"/>
    <line x1="384" y1="398" x2="430" y2="444" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
  </g>
</svg>
</body>
</html>
